[module]
name = InvoiceDownloader

[paths]
folderA = data\folder-a
folderB = data\folder-b

[input]
customerListFile = config\company-list.xlsx

[output]
fileNamingRule = {taxId}_{companyName}_{timestamp}.xlsx
invoiceFileSuffix = invoice
allowanceFileSuffix = allowance

[mof]
account = replace-with-mof-account
officialApiBaseUrl = https://service-mc.einvoice.nat.gov.tw/ptl/portal/api
appId = replace-with-official-app-id
appKey = replace-with-official-app-key
passwordEncrypted = replace-with-encrypted-password
