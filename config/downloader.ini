[module]
name = InvoiceDownloader

[paths]
folderA = data\folder-a
folderB = data\folder-b

[output]
fileNamingRule = {taxId}_{companyName}_{timestamp}.xlsx

[mof]
account = replace-with-mof-account
credentialKey = replace-with-mof-credential
invoiceDownloadMode = local
officialApiBaseUrl = https://service-mc.einvoice.nat.gov.tw/ptl/portal/api
