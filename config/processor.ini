[module]
name = InvoiceAiProcessor

[paths]
folderA = data\folder-a
folderB = data\folder-b
folderC = data\folder-c-review

[output]
fileNamingRule = {taxId}_{companyName}_{dateFrom}_{dateTo}.xlsx
invoiceOutputLabel = SalesInvoiceDetail-T3
allowanceOutputLabel = PurchaseVoucherDetail-T4
invoiceFileSuffix = invoice
allowanceFileSuffix = allowance

[review]
confidenceThreshold = 0.80

[knowledge]
repositoryFile = data\knowledge\knowledge-cases.json

[mof]
account = replace-with-mof-account
appId = replace-with-official-app-id
appKey = replace-with-official-app-key
